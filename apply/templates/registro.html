{% load static %}

<!DOCTYPE html>

<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Registrarse | Musiikkisovellus</title>

    <link rel="stylesheet" href="{% static 'apply/style.css' %}">

</head>

<body class="login-body">

    <div class="login-container">

        <div class="login-welcome">

            <div class="login-logo">
                <div class="logo-circle"></div>
                <span>LOGO</span>
            </div>

            <div class="welcome-content">

                <h1>Únete</h1>

                <p>
                    Crea tu cuenta y comienza
                    a disfrutar de tu música.
                </p>

            </div>

            <div class="welcome-footer">
                <span>Musiikkisovellus</span>
            </div>

        </div>


        <div class="login-box">

            <div class="login-header">

                <h2>Registrarse</h2>

                <p>
                    Crea una cuenta para continuar
                </p>

            </div>


            <form method="POST">

                {% csrf_token %}

                <div class="login-input">

                    <label for="Usuario">
                        Usuario
                    </label>

                    <input type="text" id="Usuario" name="Usuario" placeholder="Escribe tu usuario" required>

                </div>


                <div class="login-input">

                    <label for="Correo">
                        Correo electrónico
                    </label>

                    <input type="email" id="Correo" name="Correo" placeholder="Escribe tu correo" required>

                </div>


                <div class="login-input">

                    <label for="Contraseña">
                        Contraseña
                    </label>

                    <input type="password" id="Contraseña" name="Contraseña" placeholder="Crea una contraseña" required>

                </div>


                <div class="login-input">

                    <label for="ConfirmarContraseña">
                        Confirmar contraseña
                    </label>

                    <input type="password" id="ConfirmarContraseña" name="ConfirmarContraseña"
                        placeholder="Repite tu contraseña" required>

                </div>


                {% if error %}

                <p class="login-error">
                    {{ error }}
                </p>

                {% endif %}


                <button type="submit" class="login-button">
                    Crear cuenta
                </button>

            </form>


            <a href="{% url 'login' %}" class="register-link">
                ¿Ya tienes una cuenta? Iniciar sesión
            </a>

        </div>

    </div>

</body>

</html>
