{% load static %}
<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Eliminar canción | Musiikkisovellus</title>
    <link rel="stylesheet" href="{% static 'apply/style.css' %}">
    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            background: #101010;
            color: white;
            font-family: Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .delete-container {
            width: 100%;
            max-width: 500px;
            background: #202020;
            border-top: 6px solid #e60012;
            padding: 35px;
            text-align: center;
        }

        h1 {
            font-size: 32px;
            font-style: italic;
            color: #e60012;
        }

        .warning {
            color: #bbb;
            line-height: 1.6;
            margin-bottom: 25px;
        }

        .song-cover {
            width: 190px;
            height: 190px;
            object-fit: cover;
            border: 3px solid #e60012;
            margin-bottom: 15px;
        }

        .song-name {
            font-size: 23px;
            margin: 10px 0;
        }

        .artist {
            color: #aaa;
            margin-bottom: 25px;
        }

        .delete-buttons {
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
        }

        .delete-btn {
            flex: 1;
            min-width: 130px;
            padding: 14px;
            background: #e60012;
            color: white;
            border: none;
            text-decoration: none;
            font-weight: bold;
            cursor: pointer;
        }

        .cancel-btn {
            background: #444;
        }

        .delete-btn:hover {
            filter: brightness(1.3);
        }

        @media(max-width: 450px) {
            .delete-container {
                padding: 23px;
            }

            .delete-buttons {
                flex-direction: column;
            }
        }
    </style>
</head>

<body>
    <main class="delete-container">
        <h1>¡ATENCIÓN!</h1>

        <p class="warning">
            ¿Estás seguro de que deseas eliminar esta canción?
            Esta acción no se puede deshacer.
        </p>

        {% if cancion.imagen %}
        <img src="{{ cancion.imagen.url }}" class="song-cover" alt="{{ cancion.nombre }}">
        {% endif %}

        <h2 class="song-name">{{ cancion.nombre }}</h2>
        <p class="artist">{{ cancion.artista }}</p>

        <form method="POST">
            {% csrf_token %}

            <div class="delete-buttons">
                <button type="submit" class="delete-btn">
                    SÍ, ELIMINAR
                </button>

                <a href="{% url 'administrar_musica' %}" class="delete-btn cancel-btn">
                    CANCELAR
                </a>
            </div>
        </form>
    </main>
</body>

</html>
