{% load static %}
<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Eliminar cuenta | Musiikkisovellus</title>
    <link rel="stylesheet" href="{% static 'apply/style.css' %}">
</head>

<body class="login-body">
    <div class="login-container">
        <div class="login-box">
            <div class="login-header">
                <h2>Eliminar cuenta</h2>
                <p>
                    ¿Seguro que deseas eliminar la cuenta
                    <strong>{{ cuenta.username }}</strong>?
                </p>
                <p>Esta acción no se puede deshacer.</p>
            </div>

            <form method="POST">
                {% csrf_token %}
                <button type="submit" class="login-button">
                    Sí, eliminar cuenta
                </button>
            </form>

            <a href="{% url 'cuentas' %}" class="register-link">
                Cancelar
            </a>
        </div>
    </div>
</body>

</html>
